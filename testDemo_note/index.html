<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>个人笔记系统</title>
    <!-- 引入样式文件 -->
    <link rel="stylesheet" href="css/note.css">
</head>
<body>
    <!-- 登录注册模块 -->
    <div id="auth_box">
        <div class="auth_card">
            <h2 id="auth_title">登录</h2>
            <input type="text" id="username" placeholder="请输入用户名">
            <input type="password" id="password" placeholder="请输入密码">
            <button id="auth_btn">登录</button>
            <p id="switch_text">没有账号？去注册</p>
        </div>
    </div>

    <!-- 笔记管理模块，默认隐藏 -->
    <div id="note_box" style="display: none;">
        <div class="header">
            <span>欢迎，<span id="show_username"></span></span>
            <button id="logout_btn">退出登录</button>
        </div>
        <div class="add_area">
            <input type="text" id="note_title" placeholder="笔记标题">
            <textarea id="note_content" placeholder="笔记内容"></textarea>
            <button id="add_note_btn">添加笔记</button>
        </div>
        <div id="note_list"></div>
    </div>

    <!-- 本地jQuery，回退两层路径，保留你的文件结构 -->
    <script src="js/jquery-4.0.0.js"></script>
    <!-- 业务脚本 -->
    <script src="js/note.js"></script>
</body>
</html>
